version: 0.2

env:
  variables:
    S3_BUCKET: "testing-pipeline-45876"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - chmod +x scripts/install.sh scripts/appsec.sh
      - ./scripts/install.sh
  build:
    commands:
      - aws s3 cp data/pokebase.db s3://$S3_BUCKET/data/pokebase.db
      - aws s3 sync static/sprites/ s3://$S3_BUCKET/static/sprites/
  post_build:
    commands:
      - ./scripts/appsec.sh
