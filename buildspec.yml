version: 0.2

env:
  variables:
    S3_BUCKET: "testing-pipeline-45876"
    EC2_INSTANCE: "i-0983e695a22e6d7d2"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - chmod +x scripts/appsec.sh scripts/deploy.sh
      - python3 -m venv venv
      - source venv/bin/activate && pip install --quiet -r requirements.txt
  post_build:
    commands:
      - source venv/bin/activate && ./scripts/appsec.sh
      - ./scripts/deploy.sh
