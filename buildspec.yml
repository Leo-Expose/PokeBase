version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "pokebase"

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${IMAGE_REPO_NAME}
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REPOSITORY_URI"
  build:
    commands:
      - docker build -t "$IMAGE_REPO_NAME:latest" .
      - docker tag "$IMAGE_REPO_NAME:latest" "$REPOSITORY_URI:latest"
      - docker tag "$IMAGE_REPO_NAME:latest" "$REPOSITORY_URI:$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
  post_build:
    commands:
      - docker push "$REPOSITORY_URI:latest"
      - docker push "$REPOSITORY_URI:$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - printf '{"ImageURI":"%s"}' "$REPOSITORY_URI:latest" > imageDetail.json

artifacts:
  files:
    - '**/*'
  discard-paths: no
  exclude-paths:
    - venv/**/*
    - __pycache__/**/*
    - .git/**/*
    - .codegraph/**/*
    - .opencode/**/*
    - .github/**/*
    - data/**/*
    - static/sprites/**/*
    - pokebase-latest.zip
    - scripts/deploy.sh
    - scripts/setup-ecr.sh
