name: Deploy scripts to S3

on:
  push:
    branches:
      - master
    paths:
      - "scripts/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync scripts to S3
        run: aws s3 sync scripts/ s3://${{ secrets.DEPLOY_BUCKET }}/scripts/ --delete

      - name: Trigger CodePipeline
        run: aws codepipeline start-pipeline-execution --name pokebase-pipeline
