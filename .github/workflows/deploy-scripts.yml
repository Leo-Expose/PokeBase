name: Deploy source to S3

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create source archive
        run: git archive --format=zip -o pokebase-latest.zip HEAD

      - name: Upload to S3
        run: aws s3 cp pokebase-latest.zip s3://${{ secrets.DEPLOY_BUCKET }}/pokebase-latest.zip

      - name: Trigger CodePipeline
        run: aws codepipeline start-pipeline-execution --name pokebase-pipeline
