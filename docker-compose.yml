services:
  pokebase:
    image: pokebase
    build: .
    container_name: pokebase
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - pokebase-data:/app/data
      - pokebase-sprites:/app/static/sprites
      - ./pokebase-data.tar.gz:/app/pokebase-data.tar.gz

volumes:
  pokebase-data:
  pokebase-sprites:
