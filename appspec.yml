version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/PokeBase
file_exists_behavior: OVERWRITE
hooks:
  AfterInstall:
    - location: scripts/codedeploy-after-install.sh
      timeout: 300
  ApplicationStart:
    - location: scripts/codedeploy-application-start.sh
      timeout: 60
      runas: ubuntu
